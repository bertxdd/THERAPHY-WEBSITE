<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sterling Counseling - Book an Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Sterling Counseling</h1>
                <p>Lorem ipsum dolor sit amet.</p>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#about">About Us</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container main-content">
        <div class="content-wrapper">
            <!-- Calendar Section -->
            <section class="calendar-section">
                <h3>Select Your Date</h3>
                <div class="calendar">
                    <div class="calendar-header">
                        <button id="prevMonth" class="nav-btn">&lt;</button>
                        <h4 id="monthYear"></h4>
                        <button id="nextMonth" class="nav-btn">&gt;</button>
                    </div>
                    <div class="weekdays">
                        <div>Tu</div>
                        <div>Mo</div>
                        <div>Tu</div>
                        <div>We</div>
                        <div>Th</div>
                        <div>Fr</div>
                        <div>Sa</div>
                    </div>
                    <div id="calendarDays" class="calendar-days"></div>
                </div>
            </section>

            <!-- Booking Form Section -->
            <section class="form-section">
                <h3>Book an Appointment</h3>
                <form id="bookingForm" class="booking-form">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="field1">Lorem</label>
                        <input type="text" id="field1" name="field1" required>
                    </div>

                    <div class="form-group">
                        <label for="field2">Lorem</label>
                        <input type="text" id="field2" name="field2" required>
                    </div>

                    <div class="form-group">
                        <label for="field3">Lorem</label>
                        <input type="text" id="field3" name="field3" required>
                    </div>

                    <button type="submit" class="submit-btn">Confirm Appointment</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Sterling Counseling. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Initialize calendar on appointment page
        document.addEventListener('DOMContentLoaded', initCalendar);
    </script>
</body>
</html>
